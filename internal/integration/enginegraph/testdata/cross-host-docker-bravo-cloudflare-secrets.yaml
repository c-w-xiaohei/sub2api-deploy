revisionKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
cloudflare: {apiToken: cloudflare-api-token-canary}
reverseProxy: {dnsChallengeToken: dns-challenge-token-canary}
apps:
  app:
    initialAdminPassword: app-admin-password-canary
    jwtSecret: app-jwt-secret-canary
    totpEncryptionKey: app-totp-key-canary
    environment: {PRIVATE_FLAG: private-flag-canary}
    postgres: {username: appuser, password: app-postgres-password-canary}
    redis: {username: default, password: app-redis-password-canary}
postgres:
  app-postgres: {adminPassword: postgres-admin-password-canary}
redis:
  app-redis: {adminPassword: redis-admin-password-canary}
