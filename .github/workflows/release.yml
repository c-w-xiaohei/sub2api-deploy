name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository
        run: bash scripts/verify-release.sh

  build:
    name: Build ${{ matrix.arch }} release
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Build release components
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          components="dist/components-linux-${{ matrix.arch }}"
          mkdir -p "${components}"
          go build -trimpath -o "${components}/sub2api-deploy" ./cmd/sub2api-deploy
          scripts/build-pulumi-release.sh "${components}/pulumi-program"
          go build -trimpath -o "${components}/pulumi-resource-sub2api-host" ./cmd/pulumi-resource-sub2api-host
          for goarch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" go build -trimpath -o "${components}/sub2api-host-linux-${goarch}" ./cmd/sub2api-host
          done

      - name: Assemble deployment bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="sub2api-vps-deploy-${VERSION}-linux-${{ matrix.arch }}"
          bundle="release/${archive}"
          components="dist/components-linux-${{ matrix.arch }}"
          mkdir -p release
          rm -rf "${bundle}" "release/${archive}.tar.gz" "release/${archive}.tar.gz.sha256"
          bash scripts/release-bundle.sh assemble "${bundle}" "${components}" "${VERSION}"
          tar -C release -czf "release/${archive}.tar.gz" "${archive}"
          bash scripts/release-bundle.sh verify "release/${archive}.tar.gz"
          (cd release && sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/*.tar.gz release-assets/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
