      - name: Record required engine-graph test evidence
        id: record-engine-graph
        run: |
          evidence="evidence/${TARGET_SHA}"
          events="$RUNNER_TEMP/engine-graph-${TARGET_SHA}-events.jsonl"
          stderr="$RUNNER_TEMP/engine-graph-${TARGET_SHA}-stderr.log"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "engine-graph",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Tasks append redacted trace artifacts under this directory.\n");
          NODE
          tests='^(TestEngineGraphFailureStopsPublication|TestEngineGraphReadyPublishesAfterOrderedHosts|TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication|TestEngineConfiguredServerCountZero|TestEngineConfiguredServerCountOneTwo|TestEngineAppPlacementOneReadyFailure|TestEngineManagedUpstashPreviewPreservesComputedSecretProjection|TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor|TestEngineManagedUpstashStateIsProtectedAndRetained)$'
          export ENGINE_GRAPH_TRACE_DIR="${GITHUB_WORKSPACE}/evidence/${TARGET_SHA}/trace"
          set +e
          go test -json -count=1 -run "$tests" ./internal/integration/enginegraph > "$events" 2> "$stderr"
          test_status=$?
          set -e
          trace_files="$(find "$ENGINE_GRAPH_TRACE_DIR" -type f -name '*.jsonl' -print)"
          test -n "$trace_files"
          while IFS= read -r trace_file; do
            test -s "$trace_file"
          done <<< "$trace_files"
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
           const path = process.env.RUNNER_TEMP + `/engine-graph-${process.env.TARGET_SHA}-events.jsonl`;
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map();
          for (const line of fs.readFileSync(path, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip") terminal.set(event.Test, "skip");
            if (event.Action === "pass") terminal.set(event.Test, "pass");
            if (event.Action === "fail") terminal.set(event.Test, "fail");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE
          test "$test_status" -eq 0

      - name: Finalize engine-graph evidence
        id: finalize-engine-graph
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.record-engine-graph.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          safe="$RUNNER_TEMP/engine-graph-safe-${TARGET_SHA}"
          mkdir -p "$safe/trace"
          trap 'rc=$?; rm -f "$RUNNER_TEMP/engine-graph-${TARGET_SHA}-events.jsonl" "$RUNNER_TEMP/engine-graph-${TARGET_SHA}-stderr.log"; exit "$rc"' EXIT
          TARGET_SHA="$TARGET_SHA" RECORD_OUTCOME="$RECORD_OUTCOME" node - "$safe" "$RUNNER_TEMP/engine-graph-${TARGET_SHA}-events.jsonl" <<'NODE'
          const fs = require("node:fs");
          const [safe, ...events] = process.argv.slice(2);
          const required = new Set(["TestEngineGraphFailureStopsPublication","TestEngineGraphReadyPublishesAfterOrderedHosts","TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication","TestEngineConfiguredServerCountZero","TestEngineConfiguredServerCountOneTwo","TestEngineAppPlacementOneReadyFailure","TestEngineManagedUpstashPreviewPreservesComputedSecretProjection","TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor","TestEngineManagedUpstashStateIsProtectedAndRetained"]);
          const trace = [];
          const recordOutcome = process.env.RECORD_OUTCOME;
          if (recordOutcome === "success") {
            for (const path of events) for (const line of fs.readFileSync(path, "utf8").split("\n")) {
              if (!line) continue;
              const event = JSON.parse(line);
              if (event.Test && required.has(event.Test)) trace.push({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed });
            }
            for (const name of required) if (!trace.some((event) => event.Test === name && event.Action === "pass")) throw new Error("required sanitized test missing or nonpass");
          }
          fs.writeFileSync(safe + "/metadata.json", JSON.stringify({ sha: process.env.TARGET_SHA, runUrl: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID, gate: "engine-graph", recordOutcome }) + "\n");
          fs.writeFileSync(safe + "/trace/README.txt", "Sanitized test events only.\n");
          for (const name of ["engine-graph.jsonl"]) fs.writeFileSync(safe + "/trace/" + name, recordOutcome === "success" ? trace.map((event) => JSON.stringify(event)).join("\n") + "\n" : JSON.stringify({ Action: "error", Test: "record", Elapsed: 0, Status: "record-unavailable" }) + "\n");
          NODE
          if test "$RECORD_OUTCOME" = success; then test ! -s "$RUNNER_TEMP/engine-graph-${TARGET_SHA}-stderr.log"; fi
          expected_files=$(printf '%s\n' "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/engine-graph.jsonl")
          actual_files=$(find "$safe" -type f -print | sort)
          test "$actual_files" = "$expected_files"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for evidence_file in "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/engine-graph.jsonl"; do
            if grep -qE "$forbidden" "$evidence_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
          test "$RECORD_OUTCOME" = success || test "$RECORD_OUTCOME" = failure || test "$RECORD_OUTCOME" = cancelled || test "$RECORD_OUTCOME" = skipped

      - name: Upload engine-graph evidence
        if: always() && steps.finalize-engine-graph.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: engine-graph-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/engine-graph-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

