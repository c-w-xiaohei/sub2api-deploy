      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Prepare offline OpenSSH prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Record required provider-ssh test evidence
        id: record-provider-ssh
        run: |
          evidence="evidence/${TARGET_SHA}"
          events="$RUNNER_TEMP/provider-ssh-${TARGET_SHA}-events.jsonl"
