          path: ${{ runner.temp }}/provider-ssh-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

  provider-runtime:
    name: Provider Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Prepare offline OpenSSH prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Record required provider-runtime test evidence
        id: record-provider-runtime
        run: |
          evidence="evidence/${TARGET_SHA}/provider-runtime"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}/provider-runtime`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "provider-runtime",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Sanitized fixture traces contain no secrets or raw request frames.\n");
          NODE
          tests='^(TestProviderProcessReachesSharedTemporaryRuntimeServe|TestProviderLifecycleWithHostProcessTempRuntime)$'

          verify_normal_required_tests() {
          node - "$1" <<'NODE_NORMAL'
          const fs = require("node:fs");
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map(required.map((name) => [name, "absent"]));
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip" || event.Action === "fail") {
              throw new Error(`required test did not pass: ${event.Test} (${event.Action})`);
            }
            if (event.Action === "pass") terminal.set(event.Test, "pass");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE_NORMAL
          parser_status=$?
          if test "$parser_status" -ne 0; then
            return "$parser_status"
          fi
          test "$2" -eq 0
          }

          verify_race_required_tests() {
          node - "$1" <<'NODE_RACE'
          const fs = require("node:fs");
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map(required.map((name) => [name, "absent"]));
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip" || event.Action === "fail") {
              throw new Error(`required test did not pass: ${event.Test} (${event.Action})`);
            }
            if (event.Action === "pass") terminal.set(event.Test, "pass");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE_RACE
          parser_status=$?
          if test "$parser_status" -ne 0; then
            return "$parser_status"
          fi
          test "$2" -eq 0
          }

          extract_sanitized_trace() {
          node - "$1" "$2" <<'NODE_TRACE'
          const fs = require("node:fs");
          const required = new Set(process.env.REQUIRED_TESTS.slice(2, -2).split("|"));
          const sanitized = [];
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.has(event.Test)) continue;
            sanitized.push(JSON.stringify({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed }));
          }
          fs.writeFileSync(process.argv[3], sanitized.join("\n") + (sanitized.length ? "\n" : ""));
          NODE_TRACE
          }

          events="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal-events.jsonl"
          normal_events="$events"
          stderr="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-stderr.log"
          race_events="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race-events.jsonl"
          set +e
          go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerruntime > "$events" 2> "$stderr"
          normal_status=$?
          set -e
          set +e
          events="$race_events"
          go test -race -json -count=1 -timeout=15m -run "$tests" ./internal/integration/providerruntime > "$events" 2>> "$stderr"
          race_status=$?
          set -e
          set +e
          REQUIRED_TESTS="$tests" extract_sanitized_trace "$normal_events" "$evidence/trace/normal.jsonl"
          normal_trace_status=$?
          REQUIRED_TESTS="$tests" extract_sanitized_trace "$race_events" "$evidence/trace/race.jsonl"
          race_trace_status=$?
          set -e
          set +e
          (
            expected_files=$(printf '%s\n' "$evidence/metadata.json" "$evidence/trace/README.txt" "$evidence/trace/normal.jsonl" "$evidence/trace/race.jsonl")
            actual_files=$(find "$evidence" -type f -print | sort)
            test "$actual_files" = "$expected_files" || exit 1
            for trace_file in "$evidence/trace/normal.jsonl" "$evidence/trace/race.jsonl"; do
              test -s "$trace_file" || exit 1
              forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|\"authorization\"\s*:|sub2api-host-v1 |\"secrets\"\s*:'
              if grep -Eq "$forbidden" "$trace_file"; then
                exit 1
              fi
            done
          )
          trace_validation_status=$?
          REQUIRED_TESTS="$tests" verify_normal_required_tests "$normal_events" "$normal_status"
          normal_parser_status=$?
          REQUIRED_TESTS="$tests" verify_race_required_tests "$race_events" "$race_status"
          race_parser_status=$?
          set -e
          test "$normal_trace_status" -eq 0
          test "$race_trace_status" -eq 0
          test "$trace_validation_status" -eq 0
          test "$normal_parser_status" -eq 0
          test "$normal_status" -eq 0
          test "$race_parser_status" -eq 0
          test "$race_status" -eq 0

      - name: Finalize provider-runtime evidence
        id: finalize-provider-runtime
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.record-provider-runtime.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          safe="$RUNNER_TEMP/provider-runtime-safe-${TARGET_SHA}"
          mkdir -p "$safe/trace"
          trap 'rc=$?; rm -f "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal-events.jsonl" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race-events.jsonl" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-stderr.log"; exit "$rc"' EXIT
          TARGET_SHA="$TARGET_SHA" RECORD_OUTCOME="$RECORD_OUTCOME" node - "$safe" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal-events.jsonl" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race-events.jsonl" <<'NODE'
          const fs = require("node:fs");
          const [safe, ...events] = process.argv.slice(2);
          const required = new Set(["TestProviderProcessReachesSharedTemporaryRuntimeServe","TestProviderLifecycleWithHostProcessTempRuntime"]);
          const trace = [];
          const recordOutcome = process.env.RECORD_OUTCOME;
          if (recordOutcome === "success") {
            for (const path of events) for (const line of fs.readFileSync(path, "utf8").split("\n")) {
              if (!line) continue;
              const event = JSON.parse(line);
              if (event.Test && required.has(event.Test)) trace.push({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed });
            }
            for (const name of required) if (!trace.some((event) => event.Test === name && event.Action === "pass")) throw new Error("required sanitized test missing or nonpass");
          }
          fs.writeFileSync(safe + "/metadata.json", JSON.stringify({ sha: process.env.TARGET_SHA, runUrl: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID, gate: "provider-runtime", recordOutcome }) + "\n");
          fs.writeFileSync(safe + "/trace/README.txt", "Sanitized test events only.\n");
          for (const name of ["normal.jsonl","race.jsonl"]) fs.writeFileSync(safe + "/trace/" + name, recordOutcome === "success" ? trace.map((event) => JSON.stringify(event)).join("\n") + "\n" : JSON.stringify({ Action: "error", Test: "record", Elapsed: 0, Status: "record-unavailable" }) + "\n");
          NODE
          if test "$RECORD_OUTCOME" = success; then test ! -s "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-stderr.log"; fi
          expected_files=$(printf '%s\n' "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/normal.jsonl" "$safe/trace/race.jsonl")
          actual_files=$(find "$safe" -type f -print | sort)
          test "$actual_files" = "$expected_files"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for evidence_file in "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/normal.jsonl" "$safe/trace/race.jsonl"; do
            if grep -qE "$forbidden" "$evidence_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
          test "$RECORD_OUTCOME" = success || test "$RECORD_OUTCOME" = failure || test "$RECORD_OUTCOME" = cancelled || test "$RECORD_OUTCOME" = skipped

      - name: Upload provider-runtime evidence
        if: always() && steps.finalize-provider-runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: provider-runtime-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-runtime-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

  provider-import:
    name: Provider Import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Prepare offline OpenSSH prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Record required provider-import test evidence
        id: record-provider-import
        run: |
          evidence="evidence/${TARGET_SHA}/provider-import"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'PROVIDER_IMPORT_METADATA'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}/provider-import`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "provider-import",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Sanitized test events contain no secrets or raw request frames.\n");
          PROVIDER_IMPORT_METADATA
          test_name='TestEngineImportPreviewIsNoOpOrAcceptedDiff'
          tests='^TestEngineImportPreviewIsNoOpOrAcceptedDiff$'

          extract_sanitized_trace() {
          node - "$1" "$2" <<'PROVIDER_IMPORT_TRACE'
          const fs = require("node:fs");
          const testName = process.env.REQUIRED_TEST;
          const sanitized = [];
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.Test !== testName) continue;
            sanitized.push(JSON.stringify({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed }));
          }
          fs.writeFileSync(process.argv[3], sanitized.join("\n") + (sanitized.length ? "\n" : ""));
          PROVIDER_IMPORT_TRACE
          }

          events="$RUNNER_TEMP/provider-import-${TARGET_SHA}-events.jsonl"
          stderr="$RUNNER_TEMP/provider-import-${TARGET_SHA}-stderr.log"
          set +e
          go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerimport > "$events" 2> "$stderr"
          test_status=$?
          REQUIRED_TEST="$test_name" extract_sanitized_trace "$events" "$evidence/trace/test.jsonl"
          trace_status=$?
          REQUIRED_TEST="$test_name" TARGET_STATUS="$test_status" node - "$events" "$stderr" <<'PROVIDER_IMPORT_PARSE'
          const fs = require("node:fs");
          const testName = process.env.REQUIRED_TEST;
          const eventsPath = process.argv[2];
          const stderrPath = process.argv[3];
          let terminal = "absent";
          for (const line of fs.readFileSync(eventsPath, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.Test !== testName) continue;
            if (event.Action === "skip" || event.Action === "fail") {
              throw new Error(`required test did not pass: ${testName} (${event.Action})`);
            }
            if (event.Action === "pass") terminal = "pass";
          }
          if (terminal !== "pass") {
            throw new Error(`required test did not pass: ${testName} (${terminal})`);
          }
          const status = Number(process.env.TARGET_STATUS);
          if (status === 0 && fs.readFileSync(stderrPath, "utf8") !== "") {
            throw new Error("successful test wrote stderr");
          }
          PROVIDER_IMPORT_PARSE
          parser_status=$?
          set -e
          set +e
          (
            expected_files=$(printf '%s\n' "$evidence/metadata.json" "$evidence/trace/README.txt" "$evidence/trace/test.jsonl")
            actual_files=$(find "$evidence" -type f -print | sort)
            test "$actual_files" = "$expected_files" || exit 1
            test -s "$evidence/trace/test.jsonl" || exit 1
            forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|\"authorization\"\s*:|sub2api-host-v1 |\"secrets\"\s*:'
            for evidence_file in "$evidence/metadata.json" "$evidence/trace/README.txt" "$evidence/trace/test.jsonl"; do
              if grep -qE "$forbidden" "$evidence_file"; then
                exit 1
              fi
            done
          )
          evidence_status=$?
          set -e
          test "$trace_status" -eq 0
          test "$parser_status" -eq 0
          test "$evidence_status" -eq 0
          test "$test_status" -eq 0

      - name: Finalize provider-import evidence
        id: finalize-provider-import
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.record-provider-import.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          safe="$RUNNER_TEMP/provider-import-safe-${TARGET_SHA}"
          mkdir -p "$safe/trace"
          trap 'rc=$?; rm -f "$RUNNER_TEMP/provider-import-${TARGET_SHA}-events.jsonl" "$RUNNER_TEMP/provider-import-${TARGET_SHA}-stderr.log"; exit "$rc"' EXIT
          TARGET_SHA="$TARGET_SHA" RECORD_OUTCOME="$RECORD_OUTCOME" node - "$safe" "$RUNNER_TEMP/provider-import-${TARGET_SHA}-events.jsonl" <<'NODE'
          const fs = require("node:fs");
          const [safe, ...events] = process.argv.slice(2);
          const required = new Set(["TestEngineImportPreviewIsNoOpOrAcceptedDiff"]);
          const trace = [];
          const recordOutcome = process.env.RECORD_OUTCOME;
          if (recordOutcome === "success") {
            for (const path of events) for (const line of fs.readFileSync(path, "utf8").split("\n")) {
              if (!line) continue;
              const event = JSON.parse(line);
              if (event.Test && required.has(event.Test)) trace.push({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed });
            }
            for (const name of required) if (!trace.some((event) => event.Test === name && event.Action === "pass")) throw new Error("required sanitized test missing or nonpass");
          }
          fs.writeFileSync(safe + "/metadata.json", JSON.stringify({ sha: process.env.TARGET_SHA, runUrl: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID, gate: "provider-import", recordOutcome }) + "\n");
          fs.writeFileSync(safe + "/trace/README.txt", "Sanitized test events only.\n");
          for (const name of ["test.jsonl"]) fs.writeFileSync(safe + "/trace/" + name, recordOutcome === "success" ? trace.map((event) => JSON.stringify(event)).join("\n") + "\n" : JSON.stringify({ Action: "error", Test: "record", Elapsed: 0, Status: "record-unavailable" }) + "\n");
          NODE
          if test "$RECORD_OUTCOME" = success; then test ! -s "$RUNNER_TEMP/provider-import-${TARGET_SHA}-stderr.log"; fi
          expected_files=$(printf '%s\n' "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/test.jsonl")
          actual_files=$(find "$safe" -type f -print | sort)
          test "$actual_files" = "$expected_files"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for evidence_file in "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/test.jsonl"; do
            if grep -qE "$forbidden" "$evidence_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
          test "$RECORD_OUTCOME" = success || test "$RECORD_OUTCOME" = failure || test "$RECORD_OUTCOME" = cancelled || test "$RECORD_OUTCOME" = skipped

      - name: Upload provider-import evidence
        if: always() && steps.finalize-provider-import.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: provider-import-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-import-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

  target-release:
    name: Target Release
    needs: [verify, host-controller, engine-graph, provider-ssh, provider-runtime, provider-import]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and verify target candidate
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/target-release-$TARGET_SHA"
          components="$candidate_dir/components"
          archive_name="sub2api-controller-$TARGET_SHA.tar.gz"
          archive="$candidate_dir/$archive_name"
          bundle="$candidate_dir/bundle"
          mkdir -p "$components"
          go build -trimpath -o "$components/sub2api-deploy" ./cmd/sub2api-deploy
          scripts/build-pulumi-release.sh "$components/pulumi-program"
          go build -trimpath -o "$components/pulumi-resource-sub2api-host" ./cmd/pulumi-resource-sub2api-host
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$components/sub2api-host-linux-amd64" ./cmd/sub2api-host
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$components/sub2api-host-linux-arm64" ./cmd/sub2api-host
          bash scripts/release-bundle.sh assemble "$bundle" "$components" "$TARGET_SHA"
          tar -C "$candidate_dir" -czf "$archive" bundle
          bash scripts/release-bundle.sh verify "$archive"
          (cd "$candidate_dir" && sha256sum "$archive_name" > "$archive_name.sha256")
          (cd "$candidate_dir" && sha256sum -c "$archive_name.sha256")
      - name: Consume isolated target candidate
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/target-release-$TARGET_SHA"
          archive="$candidate_dir/sub2api-controller-$TARGET_SHA.tar.gz"
          consumer="$RUNNER_TEMP/target-release-consumer-$TARGET_SHA"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          tar -xzf "$archive" -C "$consumer"
          expected_files="$(printf '%s\n' "$consumer/bundle/Pulumi.production.example.yaml" "$consumer/bundle/Pulumi.yaml" "$consumer/bundle/README.md" "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-arm64" "$consumer/bundle/bin/go" "$consumer/bundle/bin/pulumi" "$consumer/bundle/bin/pulumi-program" "$consumer/bundle/bin/pulumi-resource-sub2api-host" "$consumer/bundle/bin/sub2api-deploy" "$consumer/bundle/go.mod" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json" | sort)"
          actual_files="$(find "$consumer" -type f -print | sort)"
          test "$actual_files" = "$expected_files"
          raw_output="$RUNNER_TEMP/target-release-$TARGET_SHA-provider-create.raw"
          SUB2API_TEST_PROVIDER_BINARY="$consumer/bundle/bin/pulumi-resource-sub2api-host" SUB2API_TEST_RELEASE_ROOT="$consumer/bundle" GOMAXPROCS=2 go test -count=1 -p=1 -run '^TestProviderProcessReachesSharedTemporaryRuntimeServe$' ./internal/integration/providerruntime > "$raw_output" 2>&1
          digest="$(sha256sum "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" | cut -d ' ' -f1)"
          node - "$candidate_dir/consumer-trace.json" "$TARGET_SHA" "$digest" <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.argv[2], JSON.stringify({ sha: process.argv[3], providerCreate: "pass", hostAMD64SHA256: process.argv[4] }) + "\n");
          NODE
          rm -f "$raw_output"
          test "$(readelf -h "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" | grep 'Machine:.*Advanced Micro Devices')"
          test "$(readelf -h "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-arm64" | grep 'Machine:.*AArch64')"
          test -x "$consumer/bundle/bin/go"
          test -x "$consumer/bundle/bin/pulumi"
          test -x "$consumer/bundle/bin/pulumi-program"
          test -x "$consumer/bundle/bin/pulumi-resource-sub2api-host"
          node - "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json" <<'NODE'
          const fs = require("node:fs");
          const [manifest, cloudflare, upstash] = process.argv.slice(2).map((path) => JSON.parse(fs.readFileSync(path, "utf8")));
          if (manifest.schemaVersion !== 1 || cloudflare.name !== "cloudflare" || upstash.name !== "upstash") throw new Error("candidate consumer metadata mismatch");
          NODE
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for text_file in "$consumer/bundle/Pulumi.production.example.yaml" "$consumer/bundle/Pulumi.yaml" "$consumer/bundle/README.md" "$consumer/bundle/go.mod" "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json" "$candidate_dir/consumer-trace.json"; do
            if grep -qE "$forbidden" "$text_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
      - name: Write target candidate metadata
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/target-release-$TARGET_SHA"
          archive="sub2api-controller-$TARGET_SHA.tar.gz"
          sha256="$(sha256sum "$candidate_dir/$archive" | cut -d ' ' -f1)"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ARCHIVE="$archive" SHA256="$sha256" node <<'NODE'
          const fs = require("node:fs");
          const gateSymbols = { verify: ["test/environment-program-target.test.ts::targets the environment program without an infra fallback"], "host-controller": ["TestRegisterFoundationGraph", "TestRegisterPreservesComputedUpstashOutputs", "TestConfigAndHostCheckPreservePropertyClassesWithoutEffects", "TestRunUsesFixedSSHArgvAndFramedStdin", "TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry", "TestStdioProcessExitsAfterOneFrameAndRejectsTwo", "TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi"], "engine-graph": ["TestEngineGraphFailureStopsPublication", "TestEngineGraphReadyPublishesAfterOrderedHosts", "TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication", "TestEngineConfiguredServerCountZero", "TestEngineConfiguredServerCountOneTwo", "TestEngineAppPlacementOneReadyFailure", "TestEngineManagedUpstashPreviewPreservesComputedSecretProjection", "TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor", "TestEngineManagedUpstashStateIsProtectedAndRetained"], "provider-ssh": ["TestProviderProcessUsesScriptedSSHTransport", "TestProtocolFrameBoundaries", "TestLoopbackStrictKnownHostAndOptionTerminator"], "provider-runtime": ["TestProviderProcessReachesSharedTemporaryRuntimeServe", "TestProviderLifecycleWithHostProcessTempRuntime"], "provider-import": ["TestEngineImportPreviewIsNoOpOrAcceptedDiff"] };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/target-release-" + process.env.TARGET_SHA + "/metadata.json", JSON.stringify({ sha: process.env.TARGET_SHA, runId: process.env.GITHUB_RUN_ID, runUrl: process.env.GITHUB_RUN_URL, gate: "target-release", archive: process.env.ARCHIVE, sha256: process.env.SHA256, requiredGateIds: ["verify", "host-controller", "engine-graph", "provider-ssh", "provider-runtime", "provider-import"], gateSymbols }) + "\n");
          NODE
          expected_artifact="$(printf '%s\n' "$candidate_dir/$archive" "$candidate_dir/$archive.sha256" "$candidate_dir/metadata.json" "$candidate_dir/consumer-trace.json" | sort)"
          actual_artifact="$(find "$candidate_dir" -maxdepth 1 -type f -print | sort)"
          test "$actual_artifact" = "$expected_artifact"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for text_file in "$candidate_dir/metadata.json" "$candidate_dir/consumer-trace.json"; do
            if grep -qE "$forbidden" "$text_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
      - name: Upload target release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: target-release-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz.sha256
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/metadata.json
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/consumer-trace.json
          if-no-files-found: error
