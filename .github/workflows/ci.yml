name: Pull-Request CI

on:
  pull_request:
  push:
    branches: ["agent/**"]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - uses: ./.github/actions/setup-pulumi-test
      - name: Test Pulumi Go shim plugin metadata
        run: bash scripts/tests/pulumi-go-shim-test.sh
      - name: Install official Cloudflare provider contract fixture
        run: |
          set -euo pipefail
          pulumi_home="$RUNNER_TEMP/cloudflare-contract-pulumi-home"
          rm -rf "$pulumi_home"
          mkdir -m 0700 "$pulumi_home"
          PULUMI_HOME="$pulumi_home" "$EXTERNAL_PULUMI_CLI" plugin install resource cloudflare 6.18.0
          provider="$pulumi_home/plugins/resource-cloudflare-v6.18.0/pulumi-resource-cloudflare"
          [[ "$provider" = /* ]]
          test -f "$provider"
          test -x "$provider"
          printf '%s\n' "CF_PROVIDER_BINARY=$provider" >> "$GITHUB_ENV"
      - name: Compile Cloudflare provider contract outside network namespace
        run: GOMAXPROCS=2 go test -c -p=1 -o "$RUNNER_TEMP/cloudflare-contract.test" ./internal/integration/cloudflarecontract
      - name: Run Cloudflare provider contract in loopback-only namespace
        run: |
          set -euo pipefail
          [[ "$CF_PROVIDER_BINARY" = /* ]]
          test -x "$CF_PROVIDER_BINARY"
          log="$RUNNER_TEMP/cloudflare-contract.log"
          sudo env CF_PROVIDER_BINARY="$CF_PROVIDER_BINARY" CF_PROVIDER_CONTRACT_REQUIRED=1 GOMAXPROCS=2 unshare --net --fork sh -ceu 'ip link set lo up; exec "$1" -test.v -test.parallel=1 -test.count=1 -test.timeout=2m' sh "$RUNNER_TEMP/cloudflare-contract.test" | tee "$log"
          grep -qE '^--- PASS: TestOfficialCloudflareProviderSchemaContract \(' "$log"
          grep -qE '^--- PASS: TestOfficialCloudflareProviderCheckContract \(' "$log"
      - name: Resolve SDK module graph in CI
        run: go mod tidy
      - name: Upload resolved SDK module graph
        uses: actions/upload-artifact@v4
        with:
          name: sdk-module-graph-${{ env.TARGET_SHA }}
          path: |
            go.mod
            go.sum
          if-no-files-found: error
      - name: Require committed SDK module graph
        run: git diff --exit-code -- go.mod go.sum
      - name: Reject embedded Engine in build and test dependencies
        run: |
          set -euo pipefail
          umask 077
          deps="$(mktemp)"; errors="$(mktemp)"
          trap 'rm -f "$deps" "$errors"' EXIT
          if ! go list -deps -test ./cmd/... ./internal/... ./infra > "$deps" 2> "$errors"; then
            printf '%s\n' 'Pulumi dependency inspection failed'
            exit 1
          fi
          if grep -qE '^github\.com/pulumi/pulumi/pkg/v3/(engine|backend|resource/deploy)(/|$)' "$deps"; then
            printf '%s\n' 'Embedded Pulumi Engine dependency remains'
            exit 1
          fi
      - name: Reject full generated Cloudflare SDK in build and test dependencies
        run: |
          set -euo pipefail
          umask 077
          deps="$(mktemp)"; errors="$(mktemp)"
          trap 'rm -f "$deps" "$errors"' EXIT
          if ! go list -deps -test ./cmd/... ./internal/... ./infra > "$deps" 2> "$errors"; then
            printf '%s\n' 'Cloudflare dependency inspection failed'
            exit 1
          fi
          if grep -qE '^github\.com/pulumi/pulumi-cloudflare/sdk(/|$)' "$deps"; then
            printf '%s\n' 'Full generated Cloudflare SDK dependency remains'
            exit 1
          fi
      - name: Run Cloudflare registration compatibility test
        run: GOMAXPROCS=2 go test -p=1 -parallel=1 ./infra
      - name: Require every Program and Cloudflare registration contract symbol
        run: |
          set -euo pipefail
          umask 077
          evidence="$(mktemp -d "$RUNNER_TEMP/cloudflare-registration.XXXXXX")"
          trap 'rm -rf "$evidence"' EXIT
          export REQUIRED_TESTS='^(TestProgramTargetUsesDedicatedGoEntrypoint|TestCloudflareRegistrationCompatibility|TestCloudflareExplicitVersionOverridesPackageDefault|TestCloudflareInputsPreserveUnknownAndSecretRPCValues|TestLegacyCloudflareCallersPreservePersistedIdentities)$'
          result=0
          GOMAXPROCS=2 go test -p=1 -parallel=1 -count=1 -json ./infra ./cmd/sub2api-environment -run "$REQUIRED_TESTS" > "$evidence/raw.jsonl" 2> "$evidence/stderr" || result=$?
          python3 scripts/ci-evidence.py required "$evidence/raw.jsonl" "$evidence/safe" cloudflare-registration.jsonl
          test "$result" -eq 0
      - name: Verify contracts and repository
        run: |
          set -euo pipefail
          python3 -m unittest scripts/tests/ci_evidence_test.py
          bash scripts/tests/release-fixture-test.sh
          bash scripts/tests/legacy-runtime-callers-test.sh
          python3 -B scripts/tests/legacy-adoption-fixture-test.py
          bash scripts/tests/legacy-rollback-fixture-test.sh
          GOMAXPROCS=2 go test -p=1 -parallel=1 ./internal/runtime
          bash scripts/verify-release.sh

  host-controller:
    name: Host Controller (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - run: go mod download && go mod verify
      - uses: ./.github/actions/setup-pulumi-test
      - name: Test Host controller and record required evidence
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/host-controller-${TARGET_SHA}-${{ matrix.arch }}.jsonl"
          stderr="$RUNNER_TEMP/host-controller-${TARGET_SHA}-${{ matrix.arch }}.stderr"
          safe="$RUNNER_TEMP/host-controller-safe-${TARGET_SHA}-${{ matrix.arch }}"
          trap 'rm -f "$raw" "$stderr"' EXIT
          tests='^(TestRegisterFoundationGraph|TestRegisterPreservesComputedUpstashOutputs|TestConfigAndHostCheckPreservePropertyClassesWithoutEffects|TestRunUsesFixedSSHArgvAndFramedStdin|TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry|TestStdioProcessExitsAfterOneFrameAndRejectsTwo|TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi)$'
          set +e
          go test -json -count=1 -run "$tests" ./internal/... ./cmd/... > "$raw" 2> "$stderr"
          status=$?
          set -e
          REQUIRED_TESTS="$tests" python3 scripts/ci-evidence.py required "$raw" "$safe" host-controller.jsonl
          test ! -s "$stderr"
          test "$status" -eq 0
          go test -count=1 ./internal/... ./cmd/...
      - name: Vet Host controller
        run: go vet ./internal/... ./cmd/...
      - name: Race-test Host controller
        if: matrix.arch == 'amd64'
        run: go test -race -count=1 $(go list ./internal/... ./cmd/... | grep -v '/internal/integration/providerruntime$')
      - name: Build Host controller binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/host-controller
          go build -o "dist/host-controller/sub2api-deploy-linux-${GOARCH}" ./cmd/sub2api-deploy
          go build -o "dist/host-controller/sub2api-environment-linux-${GOARCH}" ./cmd/sub2api-environment
          go build -o "dist/host-controller/sub2api-host-linux-${GOARCH}" ./cmd/sub2api-host
          go build -o "dist/host-controller/pulumi-resource-sub2api-host-linux-${GOARCH}" ./cmd/pulumi-resource-sub2api-host
      - uses: actions/upload-artifact@v4
        with:
          name: host-controller-${{ matrix.arch }}
          path: dist/host-controller/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: host-controller-evidence-${{ env.TARGET_SHA }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/host-controller-safe-${{ env.TARGET_SHA }}-${{ matrix.arch }}/host-controller.jsonl
          if-no-files-found: error

  engine-graph:
    name: Engine Graph
    runs-on: ubuntu-24.04
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - run: go mod download && go mod verify
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58
        with:
          pulumi-version: "3.256.0"
      - name: Provision isolated official Pulumi CLI
        run: |
          set -euo pipefail
          source="$(command -v pulumi)"
          test "$("$source" version)" = "v3.256.0"
          cli_dir="$RUNNER_TEMP/engine-graph-cli-$TARGET_SHA"
          pulumi_home="$RUNNER_TEMP/engine-graph-pulumi-home-$TARGET_SHA"
          rm -rf "$cli_dir" "$pulumi_home"
          mkdir -m 0700 "$cli_dir" "$pulumi_home" "$pulumi_home/plugins"
          cp "$source" "$cli_dir/pulumi"
          chmod 0755 "$cli_dir/pulumi"
          printf '%s\n' "ENGINE_GRAPH_PULUMI_CLI=$cli_dir/pulumi" "PULUMI_HOME=$pulumi_home" "PULUMI_PLUGIN_PATH=$pulumi_home/plugins" >> "$GITHUB_ENV"
      - name: Vet Engine Graph
        run: go vet ./internal/integration/enginegraph
      - name: Record required sanitized Engine Graph evidence
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/engine-graph-${TARGET_SHA}.jsonl"
          stderr="$RUNNER_TEMP/engine-graph-${TARGET_SHA}.stderr"
          safe="$RUNNER_TEMP/engine-graph-safe-${TARGET_SHA}"
          trace="$RUNNER_TEMP/engine-graph-trace-${TARGET_SHA}"
          mkdir -m 0700 "$trace" "$safe"
          tests='^(TestEngineGraphFailureStopsPublication|TestEngineGraphReadyPublishesAfterOrderedHosts|TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication|TestEngineConfiguredServerCountZero|TestEngineConfiguredServerCountOneTwo|TestEngineAppPlacementOneReadyFailure|TestEngineManagedUpstashPreviewPreservesComputedSecretProjection|TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor|TestEngineManagedUpstashStateIsProtectedAndRetained|TestEngineGraphCrossHostDataAdmissionOrderingAndFailureStop|TestEngineGraphCrossHostDataRemovalIsReverseStaged|TestEngineGraphTraceArtifactIsSanitizedJSONL|TestCloudflareOldCheckpointPreviewWithTypedRegistration)$'
          start_ms="$(date +%s%3N)"
          set +e
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/engine-graph-${TARGET_SHA}.rss" env ENGINE_GRAPH_TRACE_DIR="$trace" go test -json -count=1 -run "$tests" ./internal/integration/enginegraph > "$raw" 2> "$stderr"
          status=$?
          set -e
          elapsed_ms="$(( $(date +%s%3N) - start_ms ))"
           REQUIRED_TESTS="$tests" RESOURCE_ELAPSED_MS="$elapsed_ms" python3 scripts/ci-evidence.py engine-graph "$raw" "$trace" "$safe" "$RUNNER_TEMP/engine-graph-${TARGET_SHA}.rss"
          test ! -s "$stderr"
          test "$status" -eq 0
          test "$(find "$safe" -type f | wc -l)" -eq 2
      - name: Finalize Engine Graph private files
        if: always()
        run: |
          set +e
          safe="$RUNNER_TEMP/engine-graph-safe-$TARGET_SHA"
          test -d "$safe" || mkdir -m 0700 "$safe"
          test -n "$(find "$safe" -maxdepth 1 -type f -print -quit)" || { printf '%s\n' '{"schema":"engine-graph-evidence-v1","outcome":"unavailable"}' > "$safe/unavailable.json"; chmod 0600 "$safe/unavailable.json"; }
          rm -rf "$PULUMI_HOME" "$RUNNER_TEMP/engine-graph-cli-$TARGET_SHA" "$RUNNER_TEMP/engine-graph-trace-$TARGET_SHA"
          rm -f "$RUNNER_TEMP/engine-graph-${TARGET_SHA}.jsonl" "$RUNNER_TEMP/engine-graph-${TARGET_SHA}.stderr" "$RUNNER_TEMP/engine-graph-${TARGET_SHA}.rss"
          chmod 0700 "$safe"
          find "$safe" -type f -exec chmod 0600 {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-graph-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/engine-graph-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

  provider-ssh:
    name: Provider SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - run: go mod download && go mod verify
      - uses: ./.github/actions/setup-pulumi-test
      - name: Test Provider SSH and record required evidence
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/provider-ssh-${TARGET_SHA}.jsonl"; stderr="$RUNNER_TEMP/provider-ssh-${TARGET_SHA}.stderr"; safe="$RUNNER_TEMP/provider-ssh-safe-${TARGET_SHA}"
          trap 'rm -f "$raw" "$stderr"' EXIT
          tests='^(TestProviderProcessUsesScriptedSSHTransport|TestProtocolFrameBoundaries|TestLoopbackStrictKnownHostAndOptionTerminator)$'
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
          set +e; go test -json -count=1 -run "$tests" ./internal/integration/providerssh ./internal/hostprotocol ./internal/openssh > "$raw" 2> "$stderr"; status=$?; set -e
          REQUIRED_TESTS="$tests" python3 scripts/ci-evidence.py required "$raw" "$safe" provider-ssh.jsonl
          test ! -s "$stderr"; test "$status" -eq 0
          go test -count=1 ./internal/integration/providerssh ./internal/hostprotocol ./internal/openssh
      - name: Vet Provider SSH
        run: go vet ./internal/integration/providerssh ./internal/hostprotocol ./internal/openssh
      - uses: actions/upload-artifact@v4
        with:
          name: provider-ssh-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-ssh-safe-${{ env.TARGET_SHA }}/provider-ssh.jsonl
          if-no-files-found: error

  provider-runtime:
    name: Provider Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize private Provider Runtime failure evidence
        if: always()
        run: |
          set -euo pipefail
          safe="$RUNNER_TEMP/provider-runtime-safe-$TARGET_SHA"; rm -rf "$safe"; mkdir -m 0700 "$safe"; printf '%s\n' '{"status":"live-validation-not-complete"}' > "$safe/metadata.json"; chmod 0600 "$safe/metadata.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - run: go mod download && go mod verify
      - name: Run normal and race Provider Runtime gates
        run: |
          set -euo pipefail
          tests='^(TestProviderProcessReachesSharedTemporaryRuntimeServe|TestProviderLifecycleWithHostProcessTempRuntime)$'
          record_required() { MODE="$1" REQUIRED_TESTS="$tests" python3 scripts/ci-evidence.py required "$2" "$RUNNER_TEMP/provider-runtime-safe-$TARGET_SHA" "${1}.jsonl"; }
          trap 'rm -f "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal.jsonl" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal.stderr" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race.jsonl" "$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race.stderr"' EXIT
          for mode in normal race; do raw="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-${mode}.jsonl"; stderr="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-${mode}.stderr"; set +e; if test "$mode" = race; then go test -race -json -count=1 -timeout=15m -run "$tests" ./internal/integration/providerruntime > "$raw" 2> "$stderr"; else go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerruntime > "$raw" 2> "$stderr"; fi; status=$?; set -e; record_required "$mode" "$raw"; test ! -s "$stderr"; test "$status" -eq 0; rm -f "$raw" "$stderr"; done
      - name: Vet Provider Runtime
        run: go vet ./internal/integration/providerruntime
      - name: Prepare exact candidate and offline live prerequisites
        run: |
          set -euo pipefail
          sudo -n true; sudo unshare --mount --net --propagation private true; sudo apt-get update; sudo apt-get install -y --no-install-recommends openssh-server nftables iproute2 util-linux postgresql-client redis-tools sudo openssl
           for tool in dockerd docker containerd containerd-shim-runc-v2 runc timeout sshd ssh sudo nft ip unshare nsenter psql redis-cli openssl; do command -v "$tool"; done
           daemon_pid_file="$RUNNER_TEMP/provider-runtime-dockerd-${TARGET_SHA}.pid"; daemon_log="$RUNNER_TEMP/provider-runtime-dockerd-${TARGET_SHA}.log"
           if ! sudo docker info >/dev/null 2>&1; then sudo dockerd >"$daemon_log" 2>&1 & echo "$!" > "$daemon_pid_file"; fi
           ready=false; for _ in $(seq 1 45); do if sudo docker info >/dev/null 2>&1; then ready=true; break; fi; sleep 1; done; test "$ready" = true
          candidate="$RUNNER_TEMP/provider-runtime-candidate-$TARGET_SHA"; components="$candidate/components"; mkdir -p "$components"
          go build -trimpath -o "$components/sub2api-deploy" ./cmd/sub2api-deploy; scripts/build-pulumi-release.sh "$components/pulumi-program"; go build -trimpath -o "$components/pulumi-resource-sub2api-host" ./cmd/pulumi-resource-sub2api-host; CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$components/sub2api-host-linux-amd64" ./cmd/sub2api-host; CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$components/sub2api-host-linux-arm64" ./cmd/sub2api-host
           release_sha="$(printf '%s' "$TARGET_SHA" | sha256sum | cut -d ' ' -f1)"; bash scripts/release-bundle.sh assemble "$candidate/bundle" "$components" "sub2api-host-controller@sha256:$release_sha"; tar -C "$candidate" -czf "$candidate/sub2api-controller-$TARGET_SHA.tar.gz" bundle; bash scripts/release-bundle.sh verify "$candidate/sub2api-controller-$TARGET_SHA.tar.gz"; (cd "$candidate" && sha256sum "sub2api-controller-$TARGET_SHA.tar.gz" > "sub2api-controller-$TARGET_SHA.tar.gz.sha256")
          sudo docker pull postgres:18-alpine; sudo docker pull redis:8-alpine; sudo docker build --tag sub2api-live-app:mx-allowlist --file internal/integration/providerruntime/testdata/live-app.Dockerfile internal/integration/providerruntime/testdata; sudo docker save postgres:18-alpine redis:8-alpine sub2api-live-app:mx-allowlist -o "$RUNNER_TEMP/provider-runtime-images-$TARGET_SHA.tar"
      - name: Run isolated live MX-ALLOWLIST-01 gate and write candidate trace
        run: |
          set -euo pipefail
          go_bin="$(command -v go)"
          gomodcache="$(go env GOMODCACHE)"
          test -d "$gomodcache"
          candidate="$RUNNER_TEMP/provider-runtime-candidate-$TARGET_SHA"; consumer="$RUNNER_TEMP/provider-runtime-consumer-$TARGET_SHA"; raw="$RUNNER_TEMP/provider-runtime-live-$TARGET_SHA.jsonl"; stderr="$RUNNER_TEMP/provider-runtime-live-$TARGET_SHA.stderr"; image="$RUNNER_TEMP/provider-runtime-images-$TARGET_SHA.tar"; trace="$RUNNER_TEMP/provider-runtime-live-trace-$TARGET_SHA"; mkdir -p "$consumer"; mkdir -m 0700 "$trace"; chmod a+rX "$candidate" "$candidate/sub2api-controller-$TARGET_SHA.tar.gz"; tar -xzf "$candidate/sub2api-controller-$TARGET_SHA.tar.gz" -C "$consumer"; chmod -R a+rX "$consumer"; provider="$consumer/bundle/bin/pulumi-resource-sub2api-host"; provider_sha="$(sha256sum "$provider" | cut -d ' ' -f1)"; set +e; sudo --preserve-env=CI,TARGET_SHA,GOCACHE,GOPATH,GOENV env GOMODCACHE="$gomodcache" SUB2API_PROVIDER_RUNTIME_LIVE=1 SUB2API_TEST_PROVIDER_BINARY="$provider" SUB2API_TEST_RELEASE_ROOT="$consumer/bundle" SUB2API_TEST_PROVIDER_SHA256="$provider_sha" SUB2API_PROVIDER_RUNTIME_LIVE_IMAGE_ARCHIVE="$image" PROVIDER_RUNTIME_LIVE_TRACE_DIR="$trace" "$go_bin" test -json -count=1 -timeout=11m -run '^TestProviderRuntimeCrossHostDataAdmissionLive$' ./internal/integration/providerruntime > "$raw" 2> "$stderr"; status=$?; set -e; python3 scripts/ci-evidence.py live-diagnostic "$raw"; test ! -s "$stderr"; test "$status" -eq 0; host_amd64_sha="$(sha256sum "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" | cut -d ' ' -f1)"; sudo env TARGET_SHA="$TARGET_SHA" PROVIDER_SHA="$provider_sha" HOST_AMD64_SHA="$host_amd64_sha" python3 scripts/ci-evidence.py live-candidate "$raw" "$trace" "$RUNNER_TEMP/provider-runtime-safe-$TARGET_SHA" "$candidate/consumer-trace.json"
      - name: Finalize Provider Runtime private files
        if: always()
        run: |
           set +e; safe="$RUNNER_TEMP/provider-runtime-safe-$TARGET_SHA"; rm -rf "$RUNNER_TEMP/provider-runtime-consumer-$TARGET_SHA" "$RUNNER_TEMP/provider-runtime-live-trace-$TARGET_SHA"; rm -f "$RUNNER_TEMP/provider-runtime-live-$TARGET_SHA.jsonl" "$RUNNER_TEMP/provider-runtime-live-$TARGET_SHA.stderr" "$RUNNER_TEMP/provider-runtime-images-$TARGET_SHA.tar" "$RUNNER_TEMP/provider-runtime-dockerd-$TARGET_SHA.log"; if test -f "$RUNNER_TEMP/provider-runtime-dockerd-$TARGET_SHA.pid"; then kill "$(cat "$RUNNER_TEMP/provider-runtime-dockerd-$TARGET_SHA.pid")" 2>/dev/null || true; rm -f "$RUNNER_TEMP/provider-runtime-dockerd-$TARGET_SHA.pid"; fi; sudo chown -R "$USER:$USER" "$safe" "$RUNNER_TEMP/provider-runtime-candidate-$TARGET_SHA/consumer-trace.json" 2>/dev/null || true; chmod 0700 "$safe" 2>/dev/null || true; find "$safe" -type f -exec chmod 0600 {} + 2>/dev/null || true
      - name: Verify Provider Runtime evidence inventory
        if: success()
        run: test "$(find "$RUNNER_TEMP/provider-runtime-safe-$TARGET_SHA" -maxdepth 1 -type f | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-runtime-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-runtime-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: provider-runtime-candidate-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz.sha256
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/consumer-trace.json
          if-no-files-found: error

  provider-import:
    name: Provider Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - run: go mod download && go mod verify
      - uses: ./.github/actions/setup-pulumi-test
      - name: Test Provider Import and record required evidence
        run: |
          set -euo pipefail; raw="$RUNNER_TEMP/provider-import-${TARGET_SHA}.jsonl"; stderr="$RUNNER_TEMP/provider-import-${TARGET_SHA}.stderr"; safe="$RUNNER_TEMP/provider-import-safe-${TARGET_SHA}"; trap 'rm -f "$raw" "$stderr"' EXIT; tests='^(TestEngineImportPreviewIsNoOpOrAcceptedDiff)$'; sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server; set +e; go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerimport > "$raw" 2> "$stderr"; status=$?; set -e; REQUIRED_TESTS="$tests" python3 scripts/ci-evidence.py required "$raw" "$safe" provider-import.jsonl; test ! -s "$stderr"; test "$status" -eq 0; go test -count=1 -timeout=8m ./internal/integration/providerimport
      - name: Vet Provider Import
        run: go vet ./internal/integration/providerimport
      - uses: actions/upload-artifact@v4
        with:
          name: provider-import-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-import-safe-${{ env.TARGET_SHA }}/provider-import.jsonl
          if-no-files-found: error

  target-release:
    name: Target Release
    needs: [verify, host-controller, engine-graph, provider-ssh, provider-runtime, provider-import]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/download-artifact@v4
        with:
          name: provider-runtime-candidate-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}
      - name: Verify and finalize consumed candidate
        run: |
          set -euo pipefail; candidate="$RUNNER_TEMP/target-release-$TARGET_SHA"; archive="sub2api-controller-$TARGET_SHA.tar.gz"; consumer="$RUNNER_TEMP/target-release-consumer-$TARGET_SHA"; expected="$(printf '%s\n' "$candidate/$archive" "$candidate/$archive.sha256" "$candidate/consumer-trace.json" | sort)"; test "$(find "$candidate" -maxdepth 1 -type f -print | sort)" = "$expected"; (cd "$candidate" && sha256sum -c "$archive.sha256"); bash scripts/release-bundle.sh verify "$candidate/$archive"; mkdir -p "$consumer"; tar -xzf "$candidate/$archive" -C "$consumer"; expected_files="$(printf '%s\n' "$consumer/bundle/Pulumi.production.example.yaml" "$consumer/bundle/Pulumi.yaml" "$consumer/bundle/README.md" "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-arm64" "$consumer/bundle/bin/go" "$consumer/bundle/bin/pulumi" "$consumer/bundle/bin/sub2api-deploy" "$consumer/bundle/bin/pulumi-program" "$consumer/bundle/bin/pulumi-resource-sub2api-host" "$consumer/bundle/go.mod" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json" | sort)"; test "$(find "$consumer" -type f -print | sort)" = "$expected_files"; python3 scripts/ci-evidence.py verify-candidate-hashes "$consumer" "$candidate/consumer-trace.json"; provider_sha="$(sha256sum "$consumer/bundle/bin/pulumi-resource-sub2api-host" | cut -d ' ' -f1)"; host_sha="$(sha256sum "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" | cut -d ' ' -f1)"; python3 scripts/ci-evidence.py validate-consumer "$candidate/consumer-trace.json" "$TARGET_SHA" "$host_sha" "$provider_sha"; sha256="$(sha256sum "$candidate/$archive" | cut -d ' ' -f1)"; TARGET_SHA="$TARGET_SHA" ARCHIVE="$archive" SHA256="$sha256" RUN_ID="$GITHUB_RUN_ID" RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" python3 scripts/ci-evidence.py metadata "$candidate/metadata.json"; python3 scripts/ci-evidence.py validate-metadata "$candidate/metadata.json" "$TARGET_SHA" "${GITHUB_RUN_ID}" "$archive" "$sha256" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Scan target release candidate for secrets and generated IPs
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/target-release-$TARGET_SHA"
          consumer="$RUNNER_TEMP/target-release-consumer-$TARGET_SHA"
          archive="sub2api-controller-$TARGET_SHA.tar.gz"
          [[ "$archive" =~ ^sub2api-controller-[0-9a-f]{40}\.tar\.gz$ ]]
          test "$(cut -d ' ' -f1 "$candidate/$archive.sha256")" = "$(sha256sum "$candidate/$archive" | cut -d ' ' -f1)"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |CrossHost[A-Za-z0-9_]*(Password|Secret)'
          for artifact_file in "$candidate/metadata.json" "$candidate/consumer-trace.json" "$consumer/bundle/Pulumi.production.example.yaml" "$consumer/bundle/Pulumi.yaml" "$consumer/bundle/README.md" "$consumer/bundle/go.mod" "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json"; do
            ! grep -qiE "$forbidden" "$artifact_file"
          done
          for evidence_file in "$candidate/metadata.json" "$candidate/consumer-trace.json"; do
            ! grep -qE '([0-9]{1,3}\.){3}[0-9]{1,3}' "$evidence_file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: target-release-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz.sha256
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/metadata.json
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/consumer-trace.json
          if-no-files-found: error
