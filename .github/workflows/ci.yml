name: Pull-Request CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify target Environment Program contract
        run: |
          npm ci
          npx vitest run test/environment-program-target.test.ts

      - name: Verify repository
        run: bash scripts/verify-release.sh

  host-controller:
    name: Host Controller (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Record required controller test evidence
        if: matrix.arch == 'amd64'
        run: |
          evidence="evidence/${TARGET_SHA}"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "controller-candidates",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Tasks append redacted trace artifacts under this directory.\n");
          NODE
          tests='^(TestRegisterFoundationGraph|TestRegisterPreservesComputedUpstashOutputs|TestConfigAndHostCheckPreservePropertyClassesWithoutEffects|TestRunUsesFixedSSHArgvAndFramedStdin|TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry|TestStdioProcessExitsAfterOneFrameAndRejectsTwo|TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi)$'
          set +e
          go test -json -count=1 -run "$tests" ./internal/... ./cmd/... > "$evidence/events.jsonl"
          test_status=$?
          set -e
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
          const path = `evidence/${process.env.TARGET_SHA}/events.jsonl`;
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map();
          for (const line of fs.readFileSync(path, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip") terminal.set(event.Test, "skip");
            if (event.Action === "pass") terminal.set(event.Test, "pass");
            if (event.Action === "fail") terminal.set(event.Test, "fail");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE
          test "$test_status" -eq 0

      - name: Upload controller evidence
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: controller-evidence-${{ env.TARGET_SHA }}
          path: evidence/${{ env.TARGET_SHA }}/
          if-no-files-found: error

      - name: Test Host controller
        run: go test -count=1 ./internal/... ./cmd/...

      - name: Vet Host controller
        run: go vet ./internal/... ./cmd/...

      - name: Race-test Host controller
        if: matrix.arch == 'amd64'
        run: |
          target_package="github.com/c-w-xiaohei/sub2api-deploy/internal/integration/providerruntime"
          package_file="$RUNNER_TEMP/host-controller-packages.txt"
          if ! go list ./internal/... ./cmd/... > "$package_file"; then
            exit 1
          fi
          mapfile -t packages < "$package_file"
          rm -f "$package_file"
          found=false
          filtered=()
          for package in "${packages[@]}"; do
            if [[ "$package" == "$target_package" ]]; then
              found=true
              continue
            fi
            filtered+=("$package")
          done
          test "$found" = true
          test "${#filtered[@]}" -gt 0
          go test -race -count=1 "${filtered[@]}"

      - name: Prepare offline OpenSSH prerequisites
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Build Host controller binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/host-controller
          go build -o "dist/host-controller/sub2api-deploy-linux-${GOARCH}" ./cmd/sub2api-deploy
          go build -o "dist/host-controller/sub2api-environment-linux-${GOARCH}" ./cmd/sub2api-environment
          go build -o "dist/host-controller/sub2api-host-linux-${GOARCH}" ./cmd/sub2api-host
          go build -o "dist/host-controller/pulumi-resource-sub2api-host-linux-${GOARCH}" ./cmd/pulumi-resource-sub2api-host

      - name: Upload Host controller binaries
        uses: actions/upload-artifact@v4
        with:
          name: host-controller-${{ matrix.arch }}
          path: dist/host-controller/
          if-no-files-found: error

  engine-graph:
    name: Engine Graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Record required engine-graph test evidence
        run: |
          evidence="evidence/${TARGET_SHA}"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "engine-graph",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Tasks append redacted trace artifacts under this directory.\n");
          NODE
          tests='^(TestEngineGraphFailureStopsPublication|TestEngineGraphReadyPublishesAfterOrderedHosts|TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication|TestEngineConfiguredServerCountZero|TestEngineConfiguredServerCountOneTwo|TestEngineAppPlacementOneReadyFailure|TestEngineManagedUpstashPreviewPreservesComputedSecretProjection|TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor|TestEngineManagedUpstashStateIsProtectedAndRetained)$'
          export ENGINE_GRAPH_TRACE_DIR="${GITHUB_WORKSPACE}/evidence/${TARGET_SHA}/trace"
          set +e
          go test -json -count=1 -run "$tests" ./internal/integration/enginegraph > "$evidence/events.jsonl"
          test_status=$?
          set -e
          trace_files="$(find "$ENGINE_GRAPH_TRACE_DIR" -type f -name '*.jsonl' -print)"
          test -n "$trace_files"
          while IFS= read -r trace_file; do
            test -s "$trace_file"
          done <<< "$trace_files"
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
          const path = `evidence/${process.env.TARGET_SHA}/events.jsonl`;
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map();
          for (const line of fs.readFileSync(path, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip") terminal.set(event.Test, "skip");
            if (event.Action === "pass") terminal.set(event.Test, "pass");
            if (event.Action === "fail") terminal.set(event.Test, "fail");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE
          test "$test_status" -eq 0

      - name: Upload engine-graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-graph-evidence-${{ env.TARGET_SHA }}
          path: evidence/${{ env.TARGET_SHA }}/
          if-no-files-found: error

  provider-ssh:
    name: Provider SSH
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Prepare offline OpenSSH prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Record required provider-ssh test evidence
        run: |
          evidence="evidence/${TARGET_SHA}"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "provider-ssh",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Tasks append redacted trace artifacts under this directory.\n");
          NODE
          tests='^(TestProviderProcessUsesScriptedSSHTransport|TestProtocolFrameBoundaries|TestLoopbackStrictKnownHostAndOptionTerminator)$'
          set +e
          go test -json -count=1 -run "$tests" ./internal/integration/providerssh ./internal/hostprotocol ./internal/openssh > "$evidence/events.jsonl"
          test_status=$?
          set -e
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
          const path = `evidence/${process.env.TARGET_SHA}/events.jsonl`;
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map();
          for (const line of fs.readFileSync(path, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip") terminal.set(event.Test, "skip");
            if (event.Action === "pass") terminal.set(event.Test, "pass");
            if (event.Action === "fail") terminal.set(event.Test, "fail");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE
          test "$test_status" -eq 0

      - name: Upload provider-ssh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-ssh-evidence-${{ env.TARGET_SHA }}
          path: evidence/${{ env.TARGET_SHA }}/
          if-no-files-found: error

  provider-runtime:
    name: Provider Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Prepare offline OpenSSH prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Record required provider-runtime test evidence
        run: |
          evidence="evidence/${TARGET_SHA}/provider-runtime"
          mkdir -p "$evidence/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}/provider-runtime`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "provider-runtime",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Sanitized fixture traces contain no secrets or raw request frames.\n");
          NODE
          tests='^(TestProviderProcessReachesSharedTemporaryRuntimeServe|TestProviderLifecycleWithHostProcessTempRuntime)$'

          verify_normal_required_tests() {
          node - "$1" <<'NODE_NORMAL'
          const fs = require("node:fs");
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map(required.map((name) => [name, "absent"]));
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip" || event.Action === "fail") {
              throw new Error(`required test did not pass: ${event.Test} (${event.Action})`);
            }
            if (event.Action === "pass") terminal.set(event.Test, "pass");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE_NORMAL
          parser_status=$?
          if test "$parser_status" -ne 0; then
            return "$parser_status"
          fi
          test "$2" -eq 0
          }

          verify_race_required_tests() {
          node - "$1" <<'NODE_RACE'
          const fs = require("node:fs");
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map(required.map((name) => [name, "absent"]));
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip" || event.Action === "fail") {
              throw new Error(`required test did not pass: ${event.Test} (${event.Action})`);
            }
            if (event.Action === "pass") terminal.set(event.Test, "pass");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE_RACE
          parser_status=$?
          if test "$parser_status" -ne 0; then
            return "$parser_status"
          fi
          test "$2" -eq 0
          }

          extract_sanitized_trace() {
          node - "$1" "$2" <<'NODE_TRACE'
          const fs = require("node:fs");
          const required = new Set(process.env.REQUIRED_TESTS.slice(2, -2).split("|"));
          const sanitized = [];
          for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.has(event.Test)) continue;
            sanitized.push(JSON.stringify({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed }));
          }
          fs.writeFileSync(process.argv[3], sanitized.join("\n") + (sanitized.length ? "\n" : ""));
          NODE_TRACE
          }

          normal_events="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal-events.jsonl"
          normal_stderr="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-normal-stderr.log"
          race_events="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race-events.jsonl"
          race_stderr="$RUNNER_TEMP/provider-runtime-${TARGET_SHA}-race-stderr.log"
          set +e
          go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerruntime > "$normal_events" 2> "$normal_stderr"
          normal_status=$?
          set -e
          set +e
          go test -race -json -count=1 -timeout=15m -run "$tests" ./internal/integration/providerruntime > "$race_events" 2> "$race_stderr"
          race_status=$?
          set -e
          set +e
          REQUIRED_TESTS="$tests" extract_sanitized_trace "$normal_events" "$evidence/trace/normal.jsonl"
          normal_trace_status=$?
          REQUIRED_TESTS="$tests" extract_sanitized_trace "$race_events" "$evidence/trace/race.jsonl"
          race_trace_status=$?
          set -e
          set +e
          (
            expected_files=$(printf '%s\n' "$evidence/metadata.json" "$evidence/trace/README.txt" "$evidence/trace/normal.jsonl" "$evidence/trace/race.jsonl")
            actual_files=$(find "$evidence" -type f -print | sort)
            test "$actual_files" = "$expected_files" || exit 1
            for trace_file in "$evidence/trace/normal.jsonl" "$evidence/trace/race.jsonl"; do
              test -s "$trace_file" || exit 1
              forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|\"authorization\"\s*:|sub2api-host-v1 |\"secrets\"\s*:'
              if grep -Eq "$forbidden" "$trace_file"; then
                exit 1
              fi
            done
          )
          trace_validation_status=$?
          REQUIRED_TESTS="$tests" verify_normal_required_tests "$normal_events" "$normal_status"
          normal_parser_status=$?
          REQUIRED_TESTS="$tests" verify_race_required_tests "$race_events" "$race_status"
          race_parser_status=$?
          set -e
          rm -f "$normal_events" "$normal_stderr" "$race_events" "$race_stderr"
          test "$normal_trace_status" -eq 0
          test "$race_trace_status" -eq 0
          test "$trace_validation_status" -eq 0
          test "$normal_parser_status" -eq 0
          test "$normal_status" -eq 0
          test "$race_parser_status" -eq 0
          test "$race_status" -eq 0

      - name: Upload provider-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-runtime-evidence-${{ env.TARGET_SHA }}
          path: evidence/${{ env.TARGET_SHA }}/provider-runtime
          if-no-files-found: error
