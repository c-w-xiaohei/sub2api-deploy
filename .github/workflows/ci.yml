      - name: Finalize provider-ssh evidence
        id: finalize-provider-ssh
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.record-provider-ssh.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          safe="$RUNNER_TEMP/provider-ssh-safe-${TARGET_SHA}"
          mkdir -p "$safe/trace"
          trap 'rc=$?; rm -f "$RUNNER_TEMP/provider-ssh-${TARGET_SHA}-events.jsonl" "$RUNNER_TEMP/provider-ssh-${TARGET_SHA}-stderr.log"; exit "$rc"' EXIT
          TARGET_SHA="$TARGET_SHA" RECORD_OUTCOME="$RECORD_OUTCOME" node - "$safe" "$RUNNER_TEMP/provider-ssh-${TARGET_SHA}-events.jsonl" <<'NODE'
          const fs = require("node:fs");
          const [safe, ...events] = process.argv.slice(2);
          const required = new Set(["TestProviderProcessUsesScriptedSSHTransport","TestProtocolFrameBoundaries","TestLoopbackStrictKnownHostAndOptionTerminator"]);
          const trace = [];
          const recordOutcome = process.env.RECORD_OUTCOME;
          if (recordOutcome === "success") {
            for (const path of events) for (const line of fs.readFileSync(path, "utf8").split("\n")) {
