name: Pull-Request CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify target Environment Program contract
        run: |
          npm ci
          npx vitest run test/environment-program-target.test.ts test/controller-ci.test.ts test/release-ci.test.ts

      - name: Verify repository
        run: bash scripts/verify-release.sh

  host-controller:
    name: Host Controller (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Record required controller test evidence
        id: record-controller
        if: matrix.arch == 'amd64'
        run: |
          events="$RUNNER_TEMP/controller-${TARGET_SHA}-events.jsonl"
          stderr="$RUNNER_TEMP/controller-${TARGET_SHA}-stderr.log"
          mkdir -p "evidence/${TARGET_SHA}/trace"
          TARGET_SHA="$TARGET_SHA" GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" node <<'NODE'
          const fs = require("node:fs");
          const root = `evidence/${process.env.TARGET_SHA}`;
          fs.writeFileSync(`${root}/metadata.json`, JSON.stringify({
            sha: process.env.TARGET_SHA,
            runUrl: process.env.GITHUB_RUN_URL,
            gate: "controller-candidates",
          }) + "\n");
          fs.writeFileSync(`${root}/trace/README.txt`, "Tasks append redacted trace artifacts under this directory.\n");
          NODE
          tests='^(TestRegisterFoundationGraph|TestRegisterPreservesComputedUpstashOutputs|TestConfigAndHostCheckPreservePropertyClassesWithoutEffects|TestRunUsesFixedSSHArgvAndFramedStdin|TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry|TestStdioProcessExitsAfterOneFrameAndRejectsTwo|TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi)$'
          set +e
          go test -json -count=1 -run "$tests" ./internal/... ./cmd/... > "$events" 2> "$stderr"
          test_status=$?
          set -e
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
           const path = process.env.RUNNER_TEMP + `/controller-${process.env.TARGET_SHA}-events.jsonl`;
          const required = process.env.REQUIRED_TESTS.slice(2, -2).split("|");
          const terminal = new Map();
          for (const line of fs.readFileSync(path, "utf8").split("\n")) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (!event.Test || !required.includes(event.Test)) continue;
            if (event.Action === "skip") terminal.set(event.Test, "skip");
            if (event.Action === "pass") terminal.set(event.Test, "pass");
            if (event.Action === "fail") terminal.set(event.Test, "fail");
          }
          for (const name of required) {
            const result = terminal.get(name);
            if (result !== "pass") throw new Error(`required test did not pass: ${name} (${result ?? "absent"})`);
          }
          NODE
          test "$test_status" -eq 0

      - name: Finalize controller evidence
        id: finalize-controller
        if: always() && matrix.arch == 'amd64'
        env:
          RECORD_OUTCOME: ${{ steps.record-controller.outcome }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          safe="$RUNNER_TEMP/controller-safe-${TARGET_SHA}"
          mkdir -p "$safe/trace"
          trap 'rc=$?; rm -f "$RUNNER_TEMP/controller-${TARGET_SHA}-events.jsonl" "$RUNNER_TEMP/controller-${TARGET_SHA}-stderr.log"; exit "$rc"' EXIT
          TARGET_SHA="$TARGET_SHA" RECORD_OUTCOME="$RECORD_OUTCOME" node - "$safe" "$RUNNER_TEMP/controller-${TARGET_SHA}-events.jsonl" <<'NODE'
          const fs = require("node:fs");
          const [safe, ...events] = process.argv.slice(2);
          const required = new Set(["TestRegisterFoundationGraph","TestRegisterPreservesComputedUpstashOutputs","TestConfigAndHostCheckPreservePropertyClassesWithoutEffects","TestRunUsesFixedSSHArgvAndFramedStdin","TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry","TestStdioProcessExitsAfterOneFrameAndRejectsTwo","TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi"]);
          const trace = [];
          const recordOutcome = process.env.RECORD_OUTCOME;
          if (recordOutcome === "success") {
            for (const path of events) for (const line of fs.readFileSync(path, "utf8").split("\n")) {
              if (!line) continue;
              const event = JSON.parse(line);
              if (event.Test && required.has(event.Test)) trace.push({ Action: event.Action, Test: event.Test, Elapsed: event.Elapsed });
            }
            for (const name of required) if (!trace.some((event) => event.Test === name && event.Action === "pass")) throw new Error("required sanitized test missing or nonpass");
          }
          fs.writeFileSync(safe + "/metadata.json", JSON.stringify({ sha: process.env.TARGET_SHA, runUrl: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID, gate: "controller", recordOutcome }) + "\n");
          fs.writeFileSync(safe + "/trace/README.txt", "Sanitized test events only.\n");
          for (const name of ["controller.jsonl"]) fs.writeFileSync(safe + "/trace/" + name, recordOutcome === "success" ? trace.map((event) => JSON.stringify(event)).join("\n") + "\n" : JSON.stringify({ Action: "error", Test: "record", Elapsed: 0, Status: "record-unavailable" }) + "\n");
          NODE
          if test "$RECORD_OUTCOME" = success; then test ! -s "$RUNNER_TEMP/controller-${TARGET_SHA}-stderr.log"; fi
          expected_files=$(printf '%s\n' "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/controller.jsonl")
          actual_files=$(find "$safe" -type f -print | sort)
          test "$actual_files" = "$expected_files"
          forbidden='AKIA|-----BEGIN [A-Z ]*PRIVATE KEY-----|"authorization"\s*:|sub2api-host-v1 |"secrets"\s*:'
          for evidence_file in "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/controller.jsonl"; do
            if grep -qE "$forbidden" "$evidence_file"; then exit 1; else s=$?; test "$s" -eq 1 || exit 1; fi
          done
          test "$RECORD_OUTCOME" = success || test "$RECORD_OUTCOME" = failure || test "$RECORD_OUTCOME" = cancelled || test "$RECORD_OUTCOME" = skipped

      - name: Upload controller evidence
        if: always() && matrix.arch == 'amd64' && steps.finalize-controller.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: controller-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/controller-safe-${{ env.TARGET_SHA }}
          if-no-files-found: error

      - name: Test Host controller
        run: go test -count=1 ./internal/... ./cmd/...

      - name: Vet Host controller
        run: go vet ./internal/... ./cmd/...

      - name: Race-test Host controller
        if: matrix.arch == 'amd64'
        run: |
          target_package="github.com/c-w-xiaohei/sub2api-deploy/internal/integration/providerruntime"
          package_file="$RUNNER_TEMP/host-controller-packages.txt"
          if ! go list ./internal/... ./cmd/... > "$package_file"; then
            exit 1
          fi
          mapfile -t packages < "$package_file"
          rm -f "$package_file"
          found=false
          filtered=()
          for package in "${packages[@]}"; do
            if [[ "$package" == "$target_package" ]]; then
              found=true
              continue
            fi
            filtered+=("$package")
          done
          test "$found" = true
          test "${#filtered[@]}" -gt 0
          go test -race -count=1 "${filtered[@]}"

      - name: Prepare offline OpenSSH prerequisites
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          command -v sshd

      - name: Build Host controller binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/host-controller
          go build -o "dist/host-controller/sub2api-deploy-linux-${GOARCH}" ./cmd/sub2api-deploy
          go build -o "dist/host-controller/sub2api-environment-linux-${GOARCH}" ./cmd/sub2api-environment
          go build -o "dist/host-controller/sub2api-host-linux-${GOARCH}" ./cmd/sub2api-host
          go build -o "dist/host-controller/pulumi-resource-sub2api-host-linux-${GOARCH}" ./cmd/pulumi-resource-sub2api-host

      - name: Upload Host controller binaries
        uses: actions/upload-artifact@v4
        with:
          name: host-controller-${{ matrix.arch }}
          path: dist/host-controller/
          if-no-files-found: error

  engine-graph:
    name: Engine Graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact target SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
