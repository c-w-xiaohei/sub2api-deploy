          tests='^(TestProviderProcessUsesScriptedSSHTransport|TestProtocolFrameBoundaries|TestLoopbackStrictKnownHostAndOptionTerminator)$'
          set +e
          go test -json -count=1 -run "$tests" ./internal/integration/providerssh ./internal/hostprotocol ./internal/openssh > "$events" 2> "$stderr"
          test_status=$?
          set -e
          TARGET_SHA="$TARGET_SHA" REQUIRED_TESTS="$tests" node <<'NODE'
          const fs = require("node:fs");
           const path = process.env.RUNNER_TEMP + `/provider-ssh-${process.env.TARGET_SHA}-events.jsonl`;
