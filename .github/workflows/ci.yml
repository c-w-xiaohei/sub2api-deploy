          NODE
          if test "$RECORD_OUTCOME" = success; then test ! -s "$RUNNER_TEMP/provider-ssh-${TARGET_SHA}-stderr.log"; fi
          expected_files=$(printf '%s\n' "$safe/metadata.json" "$safe/trace/README.txt" "$safe/trace/provider-ssh.jsonl")
