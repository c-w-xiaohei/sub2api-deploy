      - name: Upload exact-SHA intermediate candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: provider-runtime-candidate-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz.sha256
            ${{ runner.temp }}/provider-runtime-candidate-${{ env.TARGET_SHA }}/consumer-trace.json
          if-no-files-found: error

  provider-import:
    name: Provider Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.11", cache: true }
      - run: go mod verify
      - name: Test Provider Import and record required evidence
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/provider-import-${TARGET_SHA}.jsonl"; stderr="$RUNNER_TEMP/provider-import-${TARGET_SHA}.stderr"; safe="$RUNNER_TEMP/provider-import-safe-${TARGET_SHA}"
          trap 'rm -f "$raw" "$stderr"' EXIT
          tests='^(TestEngineImportPreviewIsNoOpOrAcceptedDiff)$'
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
          set +e
          go test -json -count=1 -timeout=8m -run "$tests" ./internal/integration/providerimport > "$raw" 2> "$stderr"
          status=$?
          set -e
          REQUIRED_TESTS="$tests" node - "$raw" "$safe" <<'NODE'
          const fs=require('node:fs');const [raw,safe]=process.argv.slice(2),required=process.env.REQUIRED_TESTS.slice(2,-2).split('|'),terminal=new Map(),out=[];for(const line of fs.readFileSync(raw,'utf8').split('\n')){if(!line)continue;const e=JSON.parse(line);if(required.includes(e.Test)&&['pass','fail','skip'].includes(e.Action)){terminal.set(e.Test,e.Action);out.push({Action:e.Action,Test:e.Test,Elapsed:e.Elapsed})}}for(const test of required){const action=terminal.get(test)??'absent';console.log(`${test}: ${action}`);if(action!=='pass')throw Error(`required test did not pass: ${test}`)}fs.mkdirSync(safe,{mode:0o700});fs.writeFileSync(`${safe}/provider-import.jsonl`,out.map(JSON.stringify).join('\n')+'\n',{mode:0o600});
          NODE
          test ! -s "$stderr"
          test "$status" -eq 0
          go test -count=1 -timeout=8m ./internal/integration/providerimport
      - name: Vet Provider Import
        run: go vet ./internal/integration/providerimport
      - name: Upload sanitized Provider Import evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-import-evidence-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/provider-import-safe-${{ env.TARGET_SHA }}/provider-import.jsonl
          if-no-files-found: error

  target-release:
    name: Target Release
    needs: [verify, host-controller, engine-graph, provider-ssh, provider-runtime, provider-import]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact target SHA
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$TARGET_SHA"'
      - name: Download exact Provider Runtime candidate
        uses: actions/download-artifact@v4
        with:
          name: provider-runtime-candidate-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}
      - name: Verify and finalize consumed candidate
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/target-release-$TARGET_SHA"; archive="sub2api-controller-$TARGET_SHA.tar.gz"; consumer="$RUNNER_TEMP/target-release-consumer-$TARGET_SHA"
          expected="$(printf '%s\n' "$candidate/$archive" "$candidate/$archive.sha256" "$candidate/consumer-trace.json" | sort)"
          actual="$(find "$candidate" -maxdepth 1 -type f -print | sort)"
          test "$actual" = "$expected"
          (cd "$candidate" && sha256sum -c "$archive.sha256")
          bash scripts/release-bundle.sh verify "$candidate/$archive"
          mkdir -p "$consumer"; tar -xzf "$candidate/$archive" -C "$consumer"
          expected_files="$(printf '%s\n' "$consumer/bundle/Pulumi.production.example.yaml" "$consumer/bundle/Pulumi.yaml" "$consumer/bundle/README.md" "$consumer/bundle/artifacts/sub2api-host/manifest.json" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-arm64" "$consumer/bundle/bin/go" "$consumer/bundle/bin/pulumi" "$consumer/bundle/bin/pulumi-program" "$consumer/bundle/bin/pulumi-resource-sub2api-host" "$consumer/bundle/bin/sub2api-deploy" "$consumer/bundle/go.mod" "$consumer/bundle/scripts/pulumi-plugins/cloudflare/pulumi-plugin.json" "$consumer/bundle/scripts/pulumi-plugins/upstash/pulumi-plugin.json" | sort)"
          actual_files="$(find "$consumer" -type f -print | sort)"
          test "$actual_files" = "$expected_files"
          TARGET_SHA="$TARGET_SHA" node - "$candidate/consumer-trace.json" <<'NODE'
          const fs=require('node:fs'),t=JSON.parse(fs.readFileSync(process.argv[2],'utf8')),keys=['hostAMD64SHA256','providerRuntimeCrossHostAppLive','providerSHA256','sha']; if(JSON.stringify(Object.keys(t).sort())!==JSON.stringify(keys)||t.sha!==process.env.TARGET_SHA||t.providerRuntimeCrossHostAppLive!=='data-then-app-pass'||!['providerSHA256','hostAMD64SHA256'].every(k=>/^[0-9a-f]{64}$/.test(t[k])))throw Error('invalid consumed live trace');
          NODE
          sha256sum "$consumer/bundle/bin/pulumi-resource-sub2api-host" | grep -q "^$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).providerSHA256)' "$candidate/consumer-trace.json") "
          sha256sum "$consumer/bundle/artifacts/sub2api-host/sub2api-host-linux-amd64" | grep -q "^$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).hostAMD64SHA256)' "$candidate/consumer-trace.json") "
          sha256="$(sha256sum "$candidate/$archive" | cut -d ' ' -f1)"
          TARGET_SHA="$TARGET_SHA" ARCHIVE="$archive" SHA256="$sha256" RUN_ID="$GITHUB_RUN_ID" RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" node - "$candidate/metadata.json" <<'NODE'
          const fs=require('node:fs'); const gateSymbols={verify:['test/environment-program-target.test.ts::targets the environment program without an infra fallback'],'host-controller':['TestRegisterFoundationGraph','TestRegisterPreservesComputedUpstashOutputs','TestConfigAndHostCheckPreservePropertyClassesWithoutEffects','TestRunUsesFixedSSHArgvAndFramedStdin','TestRunOperationHoldsLockAcrossEffectAndResponseLossRetry','TestStdioProcessExitsAfterOneFrameAndRejectsTwo','TestRunPulumiPlanStagesPrivateStackAndKeepsPassphraseOutOfPulumi'],'engine-graph':['TestEngineGraphFailureStopsPublication','TestEngineGraphReadyPublishesAfterOrderedHosts','TestEngineGraphMaintenanceUpdateKeepsHostsAndRemovesPublication','TestEngineConfiguredServerCountZero','TestEngineConfiguredServerCountOneTwo','TestEngineAppPlacementOneReadyFailure','TestEngineManagedUpstashPreviewPreservesComputedSecretProjection','TestEngineGraphPartialCheckpointKeepsSuccessfulPredecessor','TestEngineManagedUpstashStateIsProtectedAndRetained','TestEngineGraphCrossHostDataAdmissionOrderingAndFailureStop','TestEngineGraphCrossHostDataRemovalIsReverseStaged','TestEngineGraphTraceArtifactIsSanitizedJSONL'],'provider-ssh':['TestProviderProcessUsesScriptedSSHTransport','TestProtocolFrameBoundaries','TestLoopbackStrictKnownHostAndOptionTerminator'],'provider-runtime':['TestProviderProcessReachesSharedTemporaryRuntimeServe','TestProviderLifecycleWithHostProcessTempRuntime','TestProviderRuntimeCrossHostDataAdmissionLive'],'provider-import':['TestEngineImportPreviewIsNoOpOrAcceptedDiff']}; fs.writeFileSync(process.argv[2],JSON.stringify({sha:process.env.TARGET_SHA,runId:process.env.RUN_ID,runUrl:process.env.RUN_URL,gate:'target-release',archive:process.env.ARCHIVE,sha256:process.env.SHA256,requiredGateIds:Object.keys(gateSymbols),gateSymbols})+'\n');
          NODE
      - name: Upload target release candidate
        uses: actions/upload-artifact@v4
        with:
          name: target-release-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/sub2api-controller-${{ env.TARGET_SHA }}.tar.gz.sha256
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/metadata.json
            ${{ runner.temp }}/target-release-${{ env.TARGET_SHA }}/consumer-trace.json
          if-no-files-found: error
