name: Publish Nix Runtime Descriptor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing audited, complete runtime assets
        required: true
        type: string
      assetmanifest:
        description: Existing release asset containing the reviewed runtime asset manifest
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: nix-runtime-descriptor-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  descriptor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG_NAME: ${{ inputs.tag }}
      ASSET_MANIFEST: ${{ inputs.assetmanifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: "2.35.2"
          add-channel: "false"
          init: "yes"
          enable-kvm: "false"
      - name: Verify tag and published candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$ASSET_MANIFEST" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*[.]json$ ]]
          project_sha="$(git rev-parse HEAD)"
          [[ "$project_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" = "$project_sha"
          mkdir -p "$RUNNER_TEMP/runtime-input"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern metadata.json --dir "$RUNNER_TEMP/runtime-input"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_MANIFEST" --dir "$RUNNER_TEMP/runtime-input"
          read -r run_id archive archive_sha < <(python3 - "$RUNNER_TEMP/runtime-input/metadata.json" "$RUNNER_TEMP/runtime-input/$ASSET_MANIFEST" "$project_sha" <<'PY'
          import json, re, sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          if metadata.get("sha") != sys.argv[3] or not re.fullmatch(r"[0-9]+", str(metadata.get("runId", ""))) or not re.fullmatch(r"[A-Za-z0-9._+-]+[.]tar[.]gz", str(metadata.get("archive", ""))) or not re.fullmatch(r"[0-9a-f]{64}", str(metadata.get("sha256", ""))):
              raise SystemExit("published metadata does not bind this tag commit to a CI candidate")
          candidate = manifest.get("ciCandidate") if isinstance(manifest, dict) else None
          expected = {"runId": str(metadata["runId"]), "archive": metadata["archive"], "archiveSha256": metadata["sha256"], "projectCommit": metadata["sha"]}
          if candidate != expected:
              raise SystemExit("asset manifest does not bind runtime assets to the published CI candidate metadata")
          print(metadata["runId"], metadata["archive"], metadata["sha256"])
          PY
          )
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP/runtime-input"
          test "$(sha256sum "$RUNNER_TEMP/runtime-input/$archive" | cut -d ' ' -f1)" = "$archive_sha"
          jobs="$RUNNER_TEMP/ci-jobs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$jobs"
          python3 scripts/ci-evidence.py validate-jobs "$jobs"
          nix_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nix-runtime.yml/runs?head_sha=$project_sha&status=success&per_page=20" --jq ".workflow_runs | map(select(.conclusion == \"success\" and .head_sha == \"$project_sha\")) | first | .id // empty")"
          [[ "$nix_run" =~ ^[0-9]+$ ]] || { printf 'no successful exact-SHA Nix Runtime Fixture run\n' >&2; exit 1; }
          gh run download "$nix_run" --repo "$GITHUB_REPOSITORY" --pattern "nix-runtime-evidence-$nix_run" --dir "$RUNNER_TEMP/nix-evidence"
          python3 - "$RUNNER_TEMP/nix-evidence/nix-runtime-evidence.json" "$project_sha" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if evidence != {"schemaVersion": 1, "sha": sys.argv[2], "tests": "runtime-fixtures"}:
              raise SystemExit("Nix runtime evidence does not match the tag commit")
          PY
          printf '%s\n' "$project_sha" > "$RUNNER_TEMP/project-sha"
      - name: Download audited runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/runtime-input/$ASSET_MANIFEST" <<'PY' > "$RUNNER_TEMP/runtime-assets.txt"
          import json, re, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assets = manifest.get("artifacts") if isinstance(manifest, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("audited manifest has no artifacts list")
          for artifact in assets:
              name = artifact.get("asset") if isinstance(artifact, dict) else None
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*[.]tar[.](gz|xz)", name):
                  raise SystemExit("audited manifest has an unsafe runtime asset name")
              print(name)
          PY
          while IFS= read -r asset; do gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/runtime-input"; done < "$RUNNER_TEMP/runtime-assets.txt"
      - name: Generate descriptor from audited bytes
        run: |
          set -euo pipefail
          project_sha="$(<"$RUNNER_TEMP/project-sha")"
          nar_command="$RUNNER_TEMP/nix-nar-hash"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'nix hash path --sri --type sha256 "$1"' > "$nar_command"
          chmod 0700 "$nar_command"
          candidate_archive="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["ciCandidate"]["archive"])' "$RUNNER_TEMP/runtime-input/$ASSET_MANIFEST")"
          python3 scripts/nix-release-descriptor.py generate --input-dir "$RUNNER_TEMP/runtime-input" --manifest "$RUNNER_TEMP/runtime-input/$ASSET_MANIFEST" --candidate-archive "$RUNNER_TEMP/runtime-input/$candidate_archive" --tag "$TAG_NAME" --project-sha "$project_sha" --output-dir "$RUNNER_TEMP/runtime-descriptor" --nar-command "$nar_command" --require-complete
          tar -C "$RUNNER_TEMP/runtime-descriptor" -czf "$RUNNER_TEMP/nix-runtime-descriptor-${TAG_NAME}.tar.gz" descriptor
      - name: Upload descriptor after manual dispatch authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          descriptor_asset="nix-runtime-descriptor-${TAG_NAME}.tar.gz"
          existing_names="$RUNNER_TEMP/existing-descriptor-assets.txt"
          existing_dir="$RUNNER_TEMP/existing-descriptor-assets"
          mkdir "$existing_dir"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$existing_names"
          publish_immutable() {
            local source="$1" name="$2"
            if grep -Fqx -- "$name" "$existing_names"; then
              gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$existing_dir"
              cmp -s "$source" "$existing_dir/$name" || { printf 'refusing to overwrite immutable descriptor asset: %s\n' "$name" >&2; exit 1; }
            else
              gh release upload "$TAG_NAME" "$source" --repo "$GITHUB_REPOSITORY"
            fi
          }
          publish_immutable "$RUNNER_TEMP/runtime-descriptor/runtime-release.json" runtime-release.json
          publish_immutable "$RUNNER_TEMP/$descriptor_asset" "$descriptor_asset"
