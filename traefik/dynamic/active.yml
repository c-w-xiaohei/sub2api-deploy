http:
  routers:
    sub2api:
      rule: "Host(`${DOMAIN}`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: sub2api-active
  services:
    sub2api-active:
      loadBalancer:
        servers:
          - url: "http://sub2api-${SLOT}:8080"

tcp:
  routers:
    sing-box-reality:
      rule: "HostSNI(`www.cloudflare.com`)"
      entryPoints:
        - websecure
      service: sing-box-reality
      tls:
        passthrough: true
  services:
    sing-box-reality:
      loadBalancer:
        servers:
          - address: "host.docker.internal:8443"
