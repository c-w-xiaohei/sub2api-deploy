entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: ${ACME_EMAIL}
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare

api:
  dashboard: false

log:
  level: INFO
