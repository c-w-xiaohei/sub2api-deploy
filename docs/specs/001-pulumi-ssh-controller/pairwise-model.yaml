  - when: data_placement == external
    require: postgres_mode == external and redis_mode == external
  - when: host_role == bootstrap_leader
    require: runtime_state == empty and secret_state == initial
  - when: host_role == follower
    require: runtime_state in [empty, healthy]
  - when: runtime_state == retired
    require: host_role == existing
  - when: proxy_mode == disabled
    require: host_role != proxy_only
  - when: data_placement == same_host and postgres_mode == external and redis_mode == external
    forbid: host_role == data_only
coverage:
