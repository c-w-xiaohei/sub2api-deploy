config:
  sub2api-environment:environmentConfig: |
    version: 1
    reverseProxy:
      image: traefik@sha256:1111111111111111111111111111111111111111111111111111111111111111
      acmeEmail: ops@example.com
    servers:
      data-one:
        sshAlias: production-data-one
        addresses:
          internal:
            ipv4: 10.42.0.10
      api-one:
        sshAlias: production-api-one
        addresses:
          public:
            ipv4: 203.0.113.21
          internal:
            ipv4: 10.42.0.21
      api-two:
        sshAlias: production-api-two
        addresses:
          public:
            ipv4: 203.0.113.22
          internal:
            ipv4: 10.42.0.22
    postgres:
      app:
        type: docker
        server: data-one
    redis:
      app:
        type: docker
        server: data-one
    apps:
      api:
        hostname: api.example.com
        image: ghcr.io/example/sub2api@sha256:2222222222222222222222222222222222222222222222222222222222222222
        initialAdminEmail: admin@example.com
        readinessPath: /healthz
        drainTimeout: 30s
        servers:
          - api-one
          - api-two
        postgres:
          name: app
          database: sub2api
        redis:
          name: app
          database: 0
        publicAccess:
          type: cloudflare
          servers:
            - api-one
            - api-two
          cloudflare:
            mode: dns
            connectBy: publicAddress
    cloudflare:
      zoneId: replace-with-zone-id
  sub2api-environment:environmentSecrets:
    secure: replace-with-encrypted-environment-secrets
