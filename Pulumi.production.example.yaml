# The Pulumi program uses the prebuilt Go binary declared by Pulumi.yaml.
# Run the offline checks and pulumi preview before applying a real stack.
config:
  sub2api-vps-deploy:resourceNamespace: sub2api
  sub2api-vps-deploy:domain: sub2api.example.com
  sub2api-vps-deploy:originIp: 203.0.113.10
  sub2api-vps-deploy:postgresMode: docker
  sub2api-vps-deploy:redisMode: docker
  sub2api-vps-deploy:sub2apiImage: weishaw/sub2api@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
  sub2api-vps-deploy:traefikImage: traefik:v3.3.3
  sub2api-vps-deploy:cloudflareZoneId: replace-with-zone-id
  sub2api-vps-deploy:acmeEmail: ops@example.com
  sub2api-vps-deploy:adminEmail: admin@example.com
  sub2api-vps-deploy:appProbePath: /api/ready
  sub2api-vps-deploy:neonResourceMode: existing
  sub2api-vps-deploy:upstashResourceMode: existing
  # Managed Neon creates a Project; Neon provisions its default Branch, Role,
  # Database, and Endpoint. It uses resourceNamespace for the project name.
  # Set neonResourceMode to create and provide neonApiToken. neonOrgId is an
  # optional override.
  # Managed Upstash derives upstashDatabaseName from resourceNamespace and
  # defaults upstashRegion to us-east-1. Set upstashResourceMode to create and
  # provide upstashApiKey plus upstashEmail.
  # For an existing external PostgreSQL service, set neonResourceMode to
  # existing and use `pulumi config set --secret neonDsn 'postgresql://...'`.
  # All passwords, tokens, and API keys use `pulumi config set --secret`:
  # cloudflareApiToken, postgresPassword, redisPassword, adminPassword,
  # jwtSecret, totpEncryptionKey, neonDsn, neonApiToken, upstashApiKey
