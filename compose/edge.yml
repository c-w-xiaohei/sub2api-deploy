# Edge Compose project (sub2api-edge): the shared Traefik edge only.
# Publishes host ports 80/443, creates the named `sub2api-edge` network, and
# mounts only edge runtime files under EDGE_RUNTIME_ROOT. Site application slots
# and data services belong to compose/site.yml, never here.
services:
  traefik:
    image: ${TRAEFIK_IMAGE:?TRAEFIK_IMAGE is required}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ${EDGE_RUNTIME_ROOT:?EDGE_RUNTIME_ROOT is required}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${EDGE_RUNTIME_ROOT:?EDGE_RUNTIME_ROOT is required}/dynamic:/etc/traefik/dynamic:ro
      - ${EDGE_RUNTIME_ROOT:?EDGE_RUNTIME_ROOT is required}/acme.json:/etc/traefik/acme.json
    networks:
      - sub2api-edge

networks:
  sub2api-edge:
    name: sub2api-edge
    driver: bridge
